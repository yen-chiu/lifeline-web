<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生命线 · Lifeline（已迁移）</title>
<link rel="canonical" href="https://yenchiu.com/chat/apps/lifeline-web/">
<meta http-equiv="refresh" content="0; url=https://yenchiu.com/chat/apps/lifeline-web/">
<meta name="robots" content="noindex">
<style>
  html, body { height: 100%; margin: 0; background: #05080c; color: #d7e6ee; }
  body { display: grid; place-items: center; font: 15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
  a { color: #6ce0c8; }
  .box { max-width: 34em; padding: 2em; text-align: center; }
  .k { letter-spacing: .35em; font-size: 11px; color: #2d5c5c; margin: 0 0 1em; }
</style>
</head>
<body>
  <div class="box">
    <p class="k">LIFELINE</p>
    <p>《生命线》网页版已迁移到新地址，正在跳转…</p>
    <p><a href="https://yenchiu.com/chat/apps/lifeline-web/">https://yenchiu.com/chat/apps/lifeline-web/</a></p>
  </div>
<script>
(function () {
  var target = 'https://yenchiu.com/chat/apps/lifeline-web/';
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        rs.forEach(function (r) { try { r.unregister(); } catch (e) {} });
      }).catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) {
        ks.forEach(function (k) { try { caches.delete(k); } catch (e) {} });
      }).catch(function () {});
    }
  } catch (e) { /* 忽略：跳转不依赖清理是否成功 */ }
  location.replace(target);
})();
</script>
</body>
</html>
